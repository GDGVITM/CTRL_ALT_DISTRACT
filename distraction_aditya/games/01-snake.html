<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Snake</title>
    <link rel="stylesheet" href="../shared/styles.css">
</head>

<body>
    <div class="game-wrap">
        <div class="timer-bar-track">
            <div class="timer-bar-fill" id="bar"></div>
        </div>
        <div class="timer-text" id="timeText"></div>
        <h1 class="title">🐍 Snake Sprint</h1>
        <p class="subtitle">Arrow keys / WASD. Eat 8 apples. Hit a wall or yourself = fail.</p>
        <canvas id="c" width="360" height="360"></canvas>
        <div class="hud" id="hud"></div>
    </div>
    <script src="../shared/distraction-kit.js"></script>
    <script>
        const ctx = document.getElementById('c').getContext('2d'), hud = document.getElementById('hud');
        const N = 20, S = 18, GOAL = 8, rnd = n => Math.floor(Math.random() * n);
        let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }], dir = { x: 1, y: 0 }, nextDir = dir, apple, score = 0, loop, over = false;
        function placeApple() { do { apple = { x: rnd(N), y: rnd(N) } } while (snake.some(s => s.x === apple.x && s.y === apple.y)) }
        function draw() { ctx.fillStyle = '#161622'; ctx.fillRect(0, 0, 360, 360); ctx.fillStyle = '#ff5c7c'; ctx.beginPath(); ctx.arc(apple.x * S + S / 2, apple.y * S + S / 2, S / 2 - 2, 0, 7); ctx.fill(); snake.forEach((s, i) => { ctx.fillStyle = i ? '#22e2c8' : '#7c5cff'; ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2) }); hud.textContent = 'Apples: ' + score + ' / ' + GOAL }
        function end(st) { over = true; clearInterval(loop); hud.textContent = st === 'pass' ? 'Nice! ✓' : 'Crashed! ✗'; DistractionKit.finish(st) }
        function tick() { dir = nextDir; const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y }; if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) return end('fail'); snake.unshift(h); if (h.x === apple.x && h.y === apple.y) { score++; if (score >= GOAL) { draw(); return end('pass') } placeApple() } else snake.pop(); draw() }
        const MAP = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
        document.addEventListener('keydown', e => { const m = MAP[e.key]; if (!m) return; e.preventDefault(); if (m[0] !== -dir.x || m[1] !== -dir.y) nextDir = { x: m[0], y: m[1] } });
        placeApple(); draw();
        DistractionKit.setOnTimeout(() => clearInterval(loop));
        DistractionKit.startTimer(document.getElementById('bar'), document.getElementById('timeText'));
        DistractionKit.whenReady(() => { loop = setInterval(tick, 120) });
    </script>
</body>

</html>
